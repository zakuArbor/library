<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Library Catalog v2.6.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-book-bookmark text-indigo-400 text-xl"></i>
        <h1 class="text-xl font-bold tracking-tight text-white">My Library</h1>
        <span class="bg-indigo-900/80 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded text-[10px] font-mono font-bold ml-1">v2.6.0</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData('csv')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white shadow transition">
          <i class="fa-solid fa-file-csv mr-1"></i> CSV
        </button>
        <button onclick="exportData('json')" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white shadow transition">
          <i class="fa-solid fa-file-code mr-1"></i> JSON
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4">

    <!-- Rapid Search & Entry Box -->
    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg mb-6 border border-slate-700">
      <label class="block text-xs font-semibold text-slate-400 mb-2">FAST ISBN SEARCH (Auto-triggers on 13 digits)</label>
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <input type="text" id="manualIsbnInput" placeholder="Enter or scan 13-digit ISBN..." 
                 oninput="checkAutoLookup(this.value)"
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-base text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono tracking-wider">
        </div>
        <div class="flex gap-2">
          <button onclick="pasteFromClipboard()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-3 rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-paste"></i>
            <span>Paste</span>
          </button>
          <button onclick="lookupManualIsbn()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">
            Lookup
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-700/60 text-xs text-slate-400">
        <label class="bg-slate-700/60 hover:bg-slate-600 text-slate-300 py-1.5 px-3 rounded-lg font-medium cursor-pointer transition flex items-center space-x-1.5">
          <i class="fa-solid fa-image text-indigo-400"></i>
          <span>Upload Barcode Photo</span>
          <input type="file" id="barcodeFileInput" accept="image/*" class="hidden" onchange="scanImageFile(this)">
        </label>
        <button onclick="openManualModal()" class="text-indigo-400 hover:underline font-medium">
          + Add Blank Entry
        </button>
      </div>
    </div>

    <!-- Status Alerts -->
    <div id="statusMessage" class="hidden p-3 rounded-xl mb-4 text-center text-sm font-medium"></div>

    <!-- Filter Bar -->
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div class="flex items-center space-x-2 overflow-x-auto pb-1 w-full sm:w-auto" id="tagFilters">
        <button onclick="filterTag('ALL')" class="tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow">All</button>
        <button onclick="filterTag('Manga')" class="tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">Manga</button>
        <button onclick="filterTag('Math')" class="tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">Math</button>
        <button onclick="filterTag('CS / Unix')" class="tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">CS / Unix</button>
      </div>
      <div class="text-xs text-slate-400 font-medium" id="bookCount">0 books</div>
    </div>

    <!-- Book Grid -->
    <div id="bookGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="bookModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-2xl overflow-y-auto max-h-[90vh]">
      <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Add / Edit Book</h3>
      <form id="bookForm" onsubmit="saveBook(event)" class="space-y-3">
        <input type="hidden" id="formId">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Title *</label>
          <input type="text" id="formTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Author</label>
            <input type="text" id="formAuthor" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">ISBN</label>
            <input type="text" id="formIsbn" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Publisher</label>
            <input type="text" id="formPublisher" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Language</label>
            <input type="text" id="formLanguage" placeholder="e.g. FR, EN, KR" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Tags (comma-separated)</label>
          <input type="text" id="formTags" placeholder="Manga, French, Ki-oon" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Cover Image URL</label>
          <input type="text" id="formCover" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Notes / Shelf Location</label>
          <textarea id="formNotes" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div class="flex space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-700 text-slate-200 py-2 rounded-xl text-sm font-semibold hover:bg-slate-600 transition">Cancel</button>
          <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-semibold hover:bg-indigo-500 transition">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let db;
    let activeTag = 'ALL';

    // Initialize Database
    const request = indexedDB.open('PersonalLibraryDB', 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('books')) {
        db.createObjectStore('books', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      renderBooks();
    };

    // Auto-lookup when user finishes entering 13 digits
    function checkAutoLookup(val) {
      const cleaned = val.replace(/[^0-9X]/gi, '');
      if (cleaned.length === 13) {
        lookupManualIsbn();
      }
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const cleaned = text.replace(/[^0-9X]/gi, '');
        if (cleaned) {
          document.getElementById('manualIsbnInput').value = cleaned;
          lookupManualIsbn();
        } else {
          showStatus('No valid ISBN numbers found in clipboard.', 'warning');
        }
      } catch (err) {
        showStatus('Clipboard permission denied. Please paste manually into the box.', 'warning');
      }
    }

    // Metadata Search Cascade
    async function fetchBookMetadata(isbn) {
      const cleaned = isbn.replace(/[^0-9X]/gi, '');
      showStatus(`Searching metadata for ISBN ${cleaned}...`, 'info');

      // Pre-mapped French/Korean catalog overrides
      const FrenchKoreanCatalog = {
        '9791032724170': {
          title: 'Frieren - Prélude',
          author: 'Mei Hachimoku / Kanehito Yamada / Tsukasa Abe',
          publisher: 'Ki-oon',
          language: 'FR',
          isbn: '9791032724170',
          cover: 'https://www.renaud-bray.com/ImagesEtiquettes/460/4603287-m.jpg',
          tags: 'Manga, Light Novel, Ki-oon, French',
          notes: 'Light novel set in the world of Frieren: Beyond Journey\'s End.'
        }
      };

      if (FrenchKoreanCatalog[cleaned]) {
        showStatus(`Found '${FrenchKoreanCatalog[cleaned].title}' in French Catalog!`, 'success');
        return FrenchKoreanCatalog[cleaned];
      }

      // Strategy 1: Google Books
      try {
        const gResp = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${cleaned}`);
        if (gResp.ok) {
          const gData = await gResp.json();
          if (gData.totalItems > 0 && gData.items && gData.items[0]) {
            const item = gData.items[0].volumeInfo;
            showStatus('Found metadata via Google Books!', 'success');
            return {
              title: item.title + (item.subtitle ? `: ${item.subtitle}` : ''),
              author: item.authors ? item.authors.join(', ') : 'Unknown',
              publisher: item.publisher || '',
              language: (item.language || '').toUpperCase(),
              isbn: cleaned,
              cover: item.imageLinks ? (item.imageLinks.thumbnail || item.imageLinks.smallThumbnail) : '',
              tags: item.categories ? item.categories.join(', ') : '',
              notes: item.description ? item.description.substring(0, 150) + '...' : ''
            };
          }
        }
      } catch (err) { console.warn('Google Books error', err); }

      // Strategy 2: Open Library
      try {
        const olResp = await fetch(`https://openlibrary.org/search.json?q=${cleaned}`);
        if (olResp.ok) {
          const olData = await olResp.json();
          if (olData.docs && olData.docs.length > 0) {
            const doc = olData.docs[0];
            showStatus('Found metadata via Open Library!', 'success');
            return {
              title: doc.title || '',
              author: doc.author_name ? doc.author_name.join(', ') : '',
              publisher: doc.publisher ? doc.publisher[0] : '',
              language: doc.language ? doc.language[0].toUpperCase() : '',
              isbn: cleaned,
              cover: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : '',
              tags: doc.subject ? doc.subject.slice(0, 3).join(', ') : '',
              notes: ''
            };
          }
        }
      } catch (err) { console.warn('Open Library error', err); }

      showStatus(`ISBN ${cleaned} not found automatically. Enter details manually below.`, 'warning');
      return { isbn: cleaned, title: '', author: '', publisher: '', cover: '', tags: '', notes: '' };
    }

    function scanImageFile(input) {
      if (input.files && input.files[0]) {
        showStatus('Analyzing barcode from image...', 'info');
        const file = input.files[0];
        const scanner = new Html5Qrcode("manualIsbnInput");
        scanner.scanFile(file, true)
          .then(decodedText => processScannedIsbn(decodedText))
          .catch(() => showStatus('Could not read barcode from image. Ensure photo is clear.', 'error'));
      }
    }

    async function processScannedIsbn(isbn) {
      const bookData = await fetchBookMetadata(isbn);
      openManualModal(bookData);
    }

    async function lookupManualIsbn() {
      const input = document.getElementById('manualIsbnInput');
      const val = input.value.trim();
      if (!val) return;
      const bookData = await fetchBookMetadata(val);
      input.value = ''; // Clear search bar for next book
      openManualModal(bookData);
    }

    // Modal & Database CRUD
    function openManualModal(data = {}) {
      document.getElementById('formId').value = data.id || '';
      document.getElementById('formTitle').value = data.title || '';
      document.getElementById('formAuthor').value = data.author || '';
      document.getElementById('formIsbn').value = data.isbn || '';
      document.getElementById('formPublisher').value = data.publisher || '';
      document.getElementById('formLanguage').value = data.language || '';
      document.getElementById('formTags').value = data.tags || '';
      document.getElementById('formCover').value = data.cover || '';
      document.getElementById('formNotes').value = data.notes || '';
      document.getElementById('modalTitle').textContent = data.id ? 'Edit Book' : 'Add New Book';
      document.getElementById('bookModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookModal').classList.add('hidden');
    }

    function saveBook(e) {
      e.preventDefault();
      const id = document.getElementById('formId').value;
      const book = {
        title: document.getElementById('formTitle').value.trim(),
        author: document.getElementById('formAuthor').value.trim(),
        isbn: document.getElementById('formIsbn').value.trim(),
        publisher: document.getElementById('formPublisher').value.trim(),
        language: document.getElementById('formLanguage').value.trim(),
        tags: document.getElementById('formTags').value.split(',').map(t => t.trim()).filter(Boolean),
        cover: document.getElementById('formCover').value.trim(),
        notes: document.getElementById('formNotes').value.trim(),
        addedAt: new Date().toISOString()
      };

      const tx = db.transaction('books', 'readwrite');
      const store = tx.objectStore('books');

      if (id) {
        book.id = parseInt(id);
        store.put(book);
      } else {
        store.add(book);
      }

      tx.oncomplete = () => {
        closeModal();
        renderBooks();
        showStatus('Book saved!', 'success');
      };
    }

    function deleteBook(id) {
      if (confirm('Delete this book?')) {
        const tx = db.transaction('books', 'readwrite');
        tx.objectStore('books').delete(id);
        tx.oncomplete = () => renderBooks();
      }
    }

    function renderBooks() {
      const tx = db.transaction('books', 'readonly');
      const store = tx.objectStore('books');
      const req = store.getAll();

      req.onsuccess = () => {
        let books = req.result;
        document.getElementById('bookCount').textContent = `${books.length} book${books.length === 1 ? '' : 's'}`;

        if (activeTag !== 'ALL') {
          books = books.filter(b => b.tags && b.tags.some(t => t.toLowerCase().includes(activeTag.toLowerCase())));
        }

        const grid = document.getElementById('bookGrid');
        if (books.length === 0) {
          grid.innerHTML = `
            <div class="col-span-2 text-center py-12 text-slate-500">
              <i class="fa-solid fa-book-open text-4xl mb-3 block"></i>
              No books cataloged yet. Enter or paste an ISBN above to get started!
            </div>`;
          return;
        }

        grid.innerHTML = books.map(b => `
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 flex space-x-4 shadow hover:border-slate-600 transition">
            <div class="w-20 h-28 bg-slate-900 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center border border-slate-700/50">
              ${b.cover 
                ? `<img src="${b.cover}" class="w-full h-full object-cover" alt="Cover">` 
                : `<i class="fa-solid fa-book text-slate-600 text-2xl"></i>`}
            </div>
            <div class="flex-1 min-w-0 flex flex-col justify-between">
              <div>
                <h4 class="font-bold text-white text-sm truncate" title="${b.title}">${b.title}</h4>
                <p class="text-xs text-slate-400 mt-0.5">${b.author || 'Unknown Author'}</p>
                <div class="flex items-center space-x-2 text-[11px] text-slate-500 mt-1">
                  ${b.publisher ? `<span>${b.publisher}</span>` : ''}
                  ${b.language ? `<span class="bg-slate-700 px-1.5 py-0.5 rounded text-slate-300 font-mono text-[10px]">${b.language}</span>` : ''}
                </div>
              </div>
              <div>
                <div class="flex flex-wrap gap-1 my-1">
                  ${(b.tags || []).map(t => `<span class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 px-2 py-0.5 rounded-md text-[10px] font-medium">${t}</span>`).join('')}
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-slate-700/50 text-[11px]">
                  <span class="text-slate-500 font-mono">${b.isbn || 'No ISBN'}</span>
                  <div class="space-x-2">
                    <button onclick="editBook(${b.id})" class="text-slate-400 hover:text-indigo-400"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteBook(${b.id})" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      };
    }

    function editBook(id) {
      const tx = db.transaction('books', 'readonly');
      const req = tx.objectStore('books').get(id);
      req.onsuccess = () => openManualModal(req.result);
    }

    function filterTag(tag) {
      activeTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.textContent.trim().toLowerCase() === tag.toLowerCase() || (tag === 'ALL' && btn.textContent.trim() === 'All')) {
          btn.className = 'tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow';
        } else {
          btn.className = 'tag-btn px-3 py-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700';
        }
      });
      renderBooks();
    }

    function exportData(format) {
      const tx = db.transaction('books', 'readonly');
      tx.objectStore('books').getAll().onsuccess = (e) => {
        const books = e.target.result;
        if (books.length === 0) return showStatus('No books to export!', 'warning');

        let content = '', filename = `library_export_${new Date().toISOString().slice(0,10)}`, type = '';

        if (format === 'csv') {
          const headers = ['Title', 'Author', 'ISBN', 'Publisher', 'Language', 'Tags', 'Notes', 'CoverURL'];
          const rows = books.map(b => [
            `"${(b.title || '').replace(/"/g, '""')}"`,
            `"${(b.author || '').replace(/"/g, '""')}"`,
            `"${b.isbn || ''}"`,
            `"${(b.publisher || '').replace(/"/g, '""')}"`,
            `"${b.language || ''}"`,
            `"${(b.tags || []).join(', ')}"`,
            `"${(b.notes || '').replace(/"/g, '""')}"`,
            `"${b.cover || ''}"`
          ].join(','));
          content = [headers.join(','), ...rows].join('\n');
          filename += '.csv';
          type = 'text/csv';
        } else {
          content = JSON.stringify(books, null, 2);
          filename += '.json';
          type = 'application/json';
        }

        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };
    }

    function showStatus(msg, level = 'info') {
      const el = document.getElementById('statusMessage');
      el.textContent = msg;
      el.className = 'p-3 rounded-xl mb-4 text-center text-sm font-medium border ';
      if (level === 'success') el.className += 'bg-emerald-950/80 text-emerald-300 border-emerald-800';
      else if (level === 'error') el.className += 'bg-red-950/80 text-red-300 border-red-800';
      else if (level === 'warning') el.className += 'bg-amber-950/80 text-amber-300 border-amber-800';
      else el.className += 'bg-slate-800 text-indigo-300 border-slate-700';

      el.classList.remove('hidden');
      if (level === 'success') setTimeout(() => el.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>
